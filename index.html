<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <input type="file" name="image" id="">

    <button>GO</button>

    <input type="file" id="imageInput" accept="image/*" />

</body>

<script>
document.getElementById("imageInput").addEventListener("change", async (event) => {
  const file = event.target.files[0];
  if (!file) return;

  // Convert file to Base64
  const base64 = await toBase64(file);

  // Send request
  fetch("https://crop.kindwise.com/api/v1/identification?details=common_names%2Ctype%2Ctaxonomy%2Ceppo_code%2Ceppo_regulation_status%2Cgbif_id%2Cimage%2Cimages%2Cwiki_url%2Cwiki_description%2Ctreatment%2Cdescription%2Csymptoms%2Cseverity%2Cspreading&language=en", {
    method: "POST",
    headers: {
      "Api-Key": "Q4ukc9LSFD4O9q2r8v5UfNn98qpV0NLp1uX32n5aSYKdH9Z12O",
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      images: [base64], // You can try removing "data:image/jpeg;base64," prefix if needed
      latitude: 49.207,
      longitude: 16.608,
      similar_images: true
    })
  })
  .then(async (response) => {
    const text = await response.text();
    try {
      const data = JSON.parse(text);
      console.log("✅ Success:", data);
    } catch {
      console.error("❌ Non-JSON response:", text);
    }
  })
  .catch(error => console.error("Fetch error:", error));
});

function toBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
  });
}
</script>



</script>

</html>
